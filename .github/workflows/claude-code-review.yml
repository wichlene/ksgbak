name: Claude Code Review

# Açılan/güncellenen her PR'ı Claude otomatik inceler ve satır içi yorum bırakır.
# İstemezsen bu dosyayı silmen yeterli; secret yoksa zaten atlanır.
on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: PR incelemesi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - name: Yetkilendirme kontrolü
        id: auth
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH_TOKEN" ] || [ -n "$API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Claude secret'ı tanımlı değil; inceleme atlandı. Kurulum icin SETUP.md."
          fi

      - name: Checkout
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude ile incele
        if: steps.auth.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Bu PR'ı incele. Türkçe, kısa ve somut yorum yaz. Odak noktaların:
            - Hata riski: null/undefined, tip uyumsuzluğu, hatalı async akış
            - Scraper katmanında kırılganlık (selector, parse, rate limit, hata yutma)
            - Supabase service_role anahtarının client tarafına sızma riski
            - Gereksiz karmaşıklık ve tekrar eden kod
            Sorun yoksa kısa bir onay yorumu bırak; süslemeye gerek yok.
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
